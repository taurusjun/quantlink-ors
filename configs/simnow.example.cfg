# SimNow / CTP test configuration.
#
# Copy this outside the repository (for example /opt/ors/configs/simnow.cfg);
# never commit a file that holds real credentials.
#
# Credentials: set CTP_PASSWORD, CTP_APP_ID and CTP_AUTH_CODE in the
# environment. They override PASSWORD / APP_ID / AUTH_CODE below, and an empty
# variable is treated as unset.

BROKER_ID     = 9999
INVESTOR_ID   = <simnow-investor>

PASSWORD      =
APP_ID        =
AUTH_CODE     =

TRADE_FRONT   = tcp://<simnow-trade-front>:30001
MD_FRONT      = tcp://<simnow-md-front>:30011

TRADER_FLOW_PATH = state/ctp/trader
MD_FLOW_PATH     = state/ctp/md
